[package]
name = "mplib"
version = "0.1.2"
edition = "2024"
description = "mplib: Micropub Publisher Library | Publish text-only blog posts to Micropub endpoints."
authors = ["Michael Descy <mike@mjdescy.me>"]
license = "MIT"
homepage = "https://github.com/mjdescy/mp"
repository = "https://github.com/mjdescy/mp"
readme = "README.md"
keywords = ["micropub", "blog", "microblog"]
categories = ["web-programming"]

[dependencies]
reqwest = { version = "0.13.5", features = ["form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
